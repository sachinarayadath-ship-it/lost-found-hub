<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Circle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <!-- Outer Search Ring -->
  <circle cx="230" cy="230" r="120" fill="none" stroke="url(#iconGrad)" stroke-width="36" />
  <!-- Search Handle -->
  <path d="M315 315 L415 415" stroke="url(#iconGrad)" stroke-width="40" stroke-linecap="round" />
  <!-- Center Plus / Pin Badge -->
  <circle cx="230" cy="230" r="45" fill="url(#accentGrad)" />
  <path d="M230 205 V255 M205 230 H255" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
</svg>
